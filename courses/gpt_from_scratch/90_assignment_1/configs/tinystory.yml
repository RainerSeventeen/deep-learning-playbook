# TinyStory 正式训练
seed: 42

model:
  vocab_size: 10000
  context_length: 256
  num_layers: 10
  d_model: 512
  num_heads: 16
  d_ff: 1344
  theta: 10000.0

optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8

training:
  data_path: /root/autodl-tmp/data/tinystories/tokenized/bpe_10k/train.npy
  val_data_path: /root/autodl-tmp/data/tinystories/tokenized/bpe_10k/valid.npy
  # Every training invocation creates runs/<timestamp>/ below this directory.
  output_dir: runs
  batch_size: 32
  # Evaluate this many randomly sampled validation batches every val_freq steps.
  val_batch_size: 32
  val_num_batches: 100
  val_freq: 500
  total_i: 40000
  log_freq: 10
  device: cuda:0

logging:
  level: INFO
  console: true

tensorboard:
  enabled: true
  # Stored at runs/<timestamp>/tensorboard for each training invocation.
  log_dir: tensorboard
